<!doctype html>
<html lang="ar" dir="rtl" class="theme-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fake</title>
    <meta name="description" content="تطبيق إدارة الأعمال وحسابات العملاء والمشتريات والخزينة" />
    <meta property="og:title" content="Fake" />
    <meta property="og:description" content="تطبيق إدارة الأعمال وحسابات العملاء والمشتريات والخزينة" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('fake_app_theme') || 'light';
          var root = document.documentElement;
          root.classList.remove('theme-light', 'theme-dark', 'theme-night', 'dark');
          if (saved === 'light') {
            root.classList.add('theme-light');
            root.style.colorScheme = 'light';
          } else if (saved === 'dark') {
            root.classList.add('dark', 'theme-dark');
            root.style.colorScheme = 'dark';
          } else if (saved === 'night') {
            root.classList.add('dark', 'theme-night');
            root.style.colorScheme = 'dark';
          }
          root.setAttribute('data-theme', saved);
        } catch(e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
